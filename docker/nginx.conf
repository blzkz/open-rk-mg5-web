server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        image/svg+xml svg;
        application/manifest+json webmanifest;
    }

    # Revalidate on every load so a new image is picked up straight away.
    add_header Cache-Control "no-cache" always;
    # WebHID is only allowed on this origin, never inside third-party iframes.
    add_header Permissions-Policy "hid=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
